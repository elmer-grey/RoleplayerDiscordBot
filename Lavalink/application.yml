server:
  port: 2333
  address: 127.0.0.1
  http2:
    enabled: false

lavalink:
  plugins:
    # YouTube source plugin — для воспроизведения с YouTube
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.1"
      repository: "https://maven.lavalink.dev/releases"
  server:
    password: "rpbot_lavalink_password"
    sources:
      youtube: false        # отключён нативный, используется плагин выше
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true            # прямые ссылки на аудио-файлы
      local: false
    filters:
      volume: true
      equalizer: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: MEDIUM
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true   # задел под поиск по названию
    soundcloudSearchEnabled: true

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""
  environment: ""

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - TVHTML5_SIMPLY  # загружает метаданные трека
      - TV              # playback-only с OAuth: получает URL потоков через remote cipher
    remoteCipher:
      url: "http://localhost:8001"
      userAgent: "RoleplayerDiscordBot"
    oauth:
      enabled: true
      refreshToken: "1//09to_XQnY_UYtCgYIARAAGAkSNwF-L9IrGXj3ukPerjG_KjY3uzp-hIPVKKhq3etQXT_L9lQhEbjdBhDcTAHDzGoM0h_pEwhMR6o"

logging:
  file:
    path: ./logs
  level:
    root: INFO
    lavalink: INFO
  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    includePayload: true
    maxPayloadLength: 10000
