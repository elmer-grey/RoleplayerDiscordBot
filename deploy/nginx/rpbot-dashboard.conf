# nginx config for RPBot WebDashboard
#
# Бот слушает на 127.0.0.1:5057 (см. RPBot/Web/WebDashboardHost.cs — Linux,
# или WebDashboardService.cs — Windows/HttpListener).
# Этот конфиг пробрасывает 80-й порт nginx наружу через loopback к боту.
#
# ВАЖНО: на Linux-деплое бот биндится только на loopback (см. конструктор
# WebDashboardHost, UseUrls). Без nginx-rev-proxy дашборд недоступен снаружи.
# Без root HttpListener/Kestrel на публичных IP падает с ErrorCode=50.
#
# Использование:
#   sudo apt install -y nginx
#   sudo cp deploy/nginx/rpbot-dashboard.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/rpbot-dashboard.conf /etc/nginx/sites-enabled/
#   # ⚠️ Проверь, что в /etc/nginx/sites-enabled/ именно СИМЛИНК, а не копия.
#   # Если там обычный файл — nginx будет игнорировать правки в sites-available.
#   #   sudo rm /etc/nginx/sites-enabled/rpbot-dashboard.conf
#   #   sudo ln -s /etc/nginx/sites-available/rpbot-dashboard.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# ────────────────────────────────────────────────────────────────────────
# ⚠️  ПЛАН-Б: аутентификация по HTTP Basic убрана (см. историю миграции
# на VPS). Причина: некоторые антивирусы и VPN-клиенты на стороне клиента
# (Kaspersky, AmneziaVPN) подставляют свой `Authorization: Basic ...`
# заголовок в исходящие HTTP-запросы. nginx честно отбивал их 401-ответом,
# что приводило к `ERR_TOO_MANY_RETRIES` в браузере (Edge/Chrome/Firefox
# зацикливали один и тот же запрос с чужим логином). На VPS трафика шла
# открытым текстом всё равно, Basic Auth не добавлял безопасности.
#
# Решение: whitelist по IP. Список ALLOWED_IPS ниже. Для прода ОБЯЗАТЕЛЬНО
# завернуть в HTTPS (Let's Encrypt) и вернуть либо Basic Auth, либо форму
# логина — IP-whitelist не защищает от перехвата трафика, только от чужих
# посетителей.
#
# nginx валидирует IP ДО того, как передать запрос бэкенду. Любой
# клиент с IP не из списка получает 403 Forbidden сразу, до проксирования.
# ────────────────────────────────────────────────────────────────────────

# IP-адреса с правом доступа к дашборду. Подставь свой внешний IP.
# Чтобы узнать: открыть https://ifconfig.me с того устройства, откуда
# заходишь в дашборд. Можно перечислить несколько — по одному в строке,
# через запятую в `geo $allowed_ip`.
geo $allowed_ip {
    default 0;

    # ⚠️  ЗАМЕНИ на свой внешний IP. Узнать: https://ifconfig.me
    # Если IP динамический — добавь свой диапазон /24 в set $allow_ip_whitelist.
    51.38.54.209 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;  # любой hostname / IP сервера

    # Дашборд и все его /api/* эндпоинты — одна location, общая аутентификация.
    location / {
        # ПЛАН-Б: whitelist по IP вместо HTTP Basic auth.
        if ($allowed_ip = 0) {
            return 403 "Access denied: IP not in whitelist.\n";
        }

        proxy_pass http://127.0.0.1:5057;
        proxy_http_version 1.1;

        # Стандартные заголовки для прокси.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Authorization больше не стрипаем — Basic Auth больше нет,
        # и клиент не должен ничего подставлять. Если что-то подставит —
        # nginx не отобьёт 401, а Kestrel спокойно проигнорирует.
        # (Kestrel в .NET 8 не ломается на Authorization header,
        #   в отличие от HttpListener из старого WebDashboardService.)

        # SSE-стрим логов (/api/logs/stream) требует отключить буферизацию
        # ответа nginx, иначе события накапливаются и приходят пачкой раз в
        # proxy_read_timeout (по умолчанию 60s).
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;   # длинный стрим — час без таймаута
        proxy_send_timeout 3600s;
    }
}