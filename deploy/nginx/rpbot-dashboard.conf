# nginx config for RPBot WebDashboard
#
# ⚠️ На октябрь 2026 WebDashboard ОТКЛЮЧЁН на Linux в коде:
# `WebDashboardService.Start()` возвращается сразу на `!OperatingSystem.IsWindows()`.
# HttpListener на 127.0.0.1 бесполезен без ssh-туннеля, на публичных IP под
# non-root падает с ErrorCode=50.
#
# Этот конфиг оставлен для будущего — когда WebDashboard переведут на Kestrel
# и можно будет пробрасывать через nginx. До тех пор этот файл — справочный
# артефакт, **не копируйте** его в /etc/nginx/sites-enabled.
#
# Бот слушает на 127.0.0.1:5057 (см. RPBot/Web/WebDashboardService.cs).
#
# Использование (когда понадобится):
#   sudo apt install -y nginx apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd-rpbot your_user
#   sudo cp deploy/nginx/rpbot-dashboard.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/rpbot-dashboard.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# Listen на 80 — рекомендуется закрыть через TLS (Let's Encrypt / certbot),
# но для локального использования 80 хватит. Для прода — добавь
# `listen 443 ssl http2;` + `ssl_certificate` / `ssl_certificate_key`.

server {
    listen 80;
    listen [::]:80;
    server_name _;  # любой hostname / IP сервера

    # Дашборд занимает корень — отдельный location под /api.
    location / {
        # 1. Basic Auth — единственная защита, пока нет TLS.
        # В проде ОБЯЗАТЕЛЬНО завернуть в HTTPS (Let's Encrypt).
        auth_basic "RPBot Dashboard";
        auth_basic_user_file /etc/nginx/.htpasswd-rpbot;

        proxy_pass http://127.0.0.1:5057;
        proxy_http_version 1.1;

        # WebSocket / SSE не используются, но оставим на всякий случай.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Дашборд любит polling — увеличенные таймауты.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;

        # Не отдавать прокси на внешние IP.
        proxy_bind 127.0.0.1;
    }

    # Закрыть прямой доступ к дашборду в обход nginx — по привычке.
    location = /api/ {
        # /api/* эндпоинты дашборда — те же правила.
        auth_basic "RPBot Dashboard";
        auth_basic_user_file /etc/nginx/.htpasswd-rpbot;

        proxy_pass http://127.0.0.1:5057;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_bind 127.0.0.1;
    }

    # Блокировать всё остальное на 80-м, кроме дашборда.
    location ~ ^/(?!$|api/) {
        # Если хочешь статический сайт вместо дашборда — замени на try_files.
        return 404;
    }
}